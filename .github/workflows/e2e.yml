name: Cretassic Hostal — BDD E2E Tests

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 02:30 UTC (22:30 Bolivia)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  # ─── Smoke Tests ─────────────────────────────────────────────────────────────
  smoke:
    name: "🔥 Smoke Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          BASE_URL:      ${{ secrets.TEST_BASE_URL }}
          ADMIN_URL:     ${{ secrets.TEST_ADMIN_URL }}
          TEST_EMAIL:    ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS:      "true"

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-smoke-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 7

  # ─── E2E Tests + Email Report ─────────────────────────────────────────────────
  e2e:
    name: "🧪 E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (with retry on flaky)
        id: e2e
        run: npm run test:e2e
        continue-on-error: true
        env:
          BASE_URL:      ${{ secrets.TEST_BASE_URL }}
          ADMIN_URL:     ${{ secrets.TEST_ADMIN_URL }}
          TEST_EMAIL:    ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          HEADLESS:      "true"

      - name: Generate email report
        if: always()
        run: |
          node scripts/generate-email.js || \
          echo "<h2>No test report generated — check Actions logs for run #${{ github.run_number }}</h2>" > reports/email-body.html

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🦕 Cretassic Hostal — E2E Report #${{ github.run_number }} | ${{ steps.e2e.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          to: mauridav377@gmail.com
          from: Cretassic Hostal CI <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://reports/email-body.html
          ignore_cert: true

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-e2e-${{ github.run_number }}
          path: reports/allure-results/
          retention-days: 30

      - name: Fail if tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
